<!doctype html>
<html lang="en">
<head>

<style>
:root{color-scheme:dark;--bg:#06100c;--panel:rgba(12,25,20,.91);--line:rgba(195,232,209,.16);--line2:rgba(205,242,219,.35);--text:#eef8f1;--muted:#9fb4a7;--faint:#6f8579;--accent:#d5f3de;--warn:#d6b876}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 16% 3%,rgba(86,134,105,.16),transparent 26%),radial-gradient(circle at 88% 0,rgba(91,128,109,.11),transparent 24%),linear-gradient(#08120e,#050a08)}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.shell{max-width:1800px;margin:auto;min-height:100vh;padding:16px 16px 78px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.eyebrow,.kicker{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}h1{margin:3px 0 0;font-size:clamp(27px,4vw,45px);letter-spacing:-.04em}.fresh{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 9px;font-size:11px;color:var(--muted);white-space:nowrap}.fresh i{width:7px;height:7px;background:var(--warn);border-radius:50%;box-shadow:0 0 14px rgba(214,184,118,.45)}.crumbs{display:flex;align-items:center;gap:5px;min-height:38px;overflow:auto;scrollbar-width:none}.crumbs::-webkit-scrollbar{display:none}.crumbs button{border:0;background:transparent;padding:5px 7px;border-radius:7px;color:#c7d9cd;white-space:nowrap}.crumbs button:hover{background:rgba(255,255,255,.05)}.sep{color:var(--faint)}.workspace{display:grid;grid-template-columns:minmax(210px,255px) minmax(0,1fr) minmax(225px,295px);gap:12px;min-height:calc(100vh - 140px)}.rail,.stage{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 28px 80px rgba(0,0,0,.34)}.rail{border-radius:16px;overflow:hidden}.railhead{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid var(--line)}.close{display:none;border:0;background:transparent;font-size:24px}.search{display:grid;gap:6px;padding:11px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}.search input{border:1px solid var(--line);border-radius:10px;background:#050c09;padding:10px 11px;width:100%}.outline{padding:7px;max-height:calc(100vh - 245px);overflow:auto}.outline button{width:100%;display:grid;grid-template-columns:10px 1fr;gap:9px;text-align:left;align-items:center;border:0;background:transparent;border-radius:10px;padding:9px 8px}.outline button:hover,.outline button.active{background:rgba(222,245,229,.06)}.outline b,.outline small{display:block}.outline b{font-size:12px}.outline small{font-size:10px;color:var(--faint);margin-top:2px}.mark{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--state,#7c8d82);box-shadow:0 0 12px color-mix(in srgb,var(--state,#7c8d82) 34%,transparent)}[data-state="authoritative"]{--state:#d7f2df}[data-state="verified"]{--state:#9ed7b0}[data-state="proposed"]{--state:#d2ad73}[data-state="unknown"]{--state:#78817c}.stage{border-radius:18px;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto}.toolbar{min-height:50px;padding:8px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.switch,.zoom{display:flex;align-items:center;gap:5px}.switch button,.zoom button{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:8px;padding:7px 9px}.switch button.active{background:rgba(255,255,255,.05);border-color:var(--line);color:var(--text)}.zoom button{border-color:var(--line);min-width:31px}.zoom span{font-size:10px;color:var(--faint);min-width:48px;text-align:center}.viewport{min-height:560px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(87,130,102,.1),transparent 26%),linear-gradient(rgba(255,255,255,.017) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.017) 1px,transparent 1px),#07100d;background-size:auto,34px 34px,34px 34px,auto}.atlas{position:absolute;inset:0;transform:scale(var(--s,1));transform-origin:50% 50%;transition:transform .18s ease}.edges{position:absolute;inset:0;width:100%;height:100%}.edges line{stroke:rgba(171,201,181,.14);stroke-width:.22;vector-effect:non-scaling-stroke}.edges line.hot{stroke:rgba(223,244,229,.58);stroke-width:.42}.node{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;gap:7px;min-width:78px;max-width:125px;border:0;background:transparent;text-align:center}.core{width:15px;height:15px;border:2px solid var(--state,#9fb2a5);border-radius:50%;background:#0a1511;box-shadow:0 0 0 7px rgba(255,255,255,.018),0 0 24px color-mix(in srgb,var(--state,#9fb2a5) 18%,transparent)}.node[data-kind="forest"] .core{width:26px;height:26px}.node[data-kind="tree"] .core{width:18px;height:18px}.node[data-kind="architecture"] .core{border-radius:5px;transform:rotate(45deg)}.node.active .core,.node:hover .core{box-shadow:0 0 0 9px rgba(216,245,225,.08),0 0 32px color-mix(in srgb,var(--state,#9fb2a5) 38%,transparent);scale:1.25}.label{font-size:9px;line-height:1.1;color:var(--muted);text-shadow:0 2px 6px rgba(0,0,0,.8)}.node.active .label{color:#fff;font-weight:700}.network,.focus{height:100%;overflow:auto;padding:clamp(18px,4vw,42px)}.center{max-width:380px;min-height:130px;margin:20px auto 28px;border:1px solid var(--line2);background:rgba(255,255,255,.035);border-radius:20px;display:grid;place-items:center;align-content:center;gap:6px;text-align:center}.center strong{font-size:22px}.center small,.card small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}.card{min-height:88px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.025);text-align:left;padding:12px;display:grid;align-content:center;gap:5px}.card:hover{border-color:var(--line2);background:rgba(255,255,255,.055)}.focus{display:grid;align-content:start;gap:26px}.focus h2{font-size:clamp(28px,4vw,45px);margin:5px 0 8px}.focus p{color:#b7c9bd;line-height:1.6;max-width:720px}.orient{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(2,minmax(100px,.6fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}.orient div{background:#0d1c16;padding:10px 12px}.orient span,.orient strong{display:block}.orient strong{font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail{padding:13px 14px;border-bottom:1px solid var(--line)}.detail h3{margin:5px 0 7px}.detail p{font-size:12px;line-height:1.5;color:#b4c6ba}.detail code{font-size:11px;color:#c8ded0;overflow-wrap:anywhere}.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}.facts div{background:#0d1c16;padding:10px 12px}.facts span,.facts b{display:block}.facts span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}.facts b{font-size:11px;margin-top:3px}.notice{background:rgba(208,174,105,.055)}.mobilebar{display:none}
@media(max-width:1000px){.workspace{grid-template-columns:220px minmax(0,1fr)}.inspector{position:fixed;z-index:40;right:10px;top:72px;bottom:72px;width:min(340px,calc(100vw - 20px));transform:translateX(calc(100% + 24px));transition:transform .18s ease}.inspector.open{transform:translateX(0)}.close{display:block}.mobilebar{display:grid;grid-template-columns:repeat(5,1fr)}}
@media(max-width:720px){.shell{padding:11px 9px 76px}.top{align-items:flex-start}.top h1{font-size:28px}.fresh{font-size:9px;padding:6px 7px}.workspace{display:block;min-height:auto}.stage{min-height:calc(100svh - 160px);border-radius:14px}.viewport{min-height:calc(100svh - 270px)}.left{position:fixed;z-index:45;left:9px;top:72px;bottom:72px;width:min(330px,calc(100vw - 18px));transform:translateX(calc(-100% - 24px));transition:transform .18s ease}.left.open{transform:translateX(0)}.outline{max-height:calc(100svh - 205px)}.orient{grid-template-columns:1fr 1fr}.orient div:first-child{grid-column:1/-1}.toolbar{flex-wrap:wrap}.node{min-width:60px;max-width:82px}.label{font-size:8px}.mobilebar{position:fixed;z-index:50;left:8px;right:8px;bottom:8px;min-height:54px;border:1px solid var(--line2);border-radius:15px;overflow:hidden;background:rgba(7,16,13,.95);backdrop-filter:blur(18px);box-shadow:0 18px 60px rgba(0,0,0,.5)}.mobilebar button{border:0;border-right:1px solid var(--line);background:transparent;color:#b8cabe;font-size:10px;padding:5px}.mobilebar button:last-child{border-right:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div><div class="eyebrow">FOREST SUBSTRATE · PORTABLE PROJECTION</div><h1 id="title">The Forest</h1></div><div class="fresh"><i></i> snapshot · 2026-09-05</div></header>
<nav class="crumbs" id="crumbs" aria-label="Current location"></nav>
<section class="workspace">
<aside class="rail left" id="left"><div class="railhead"><strong>Outline</strong><button class="close" data-close="left">×</button></div><label class="search">Search<input id="search" placeholder="Find a place…" /></label><div class="outline" id="outline"></div></aside>
<section class="stage"><div class="toolbar"><div class="switch" id="views"><button data-view="atlas">atlas</button><button data-view="outline">outline</button><button data-view="network">network</button></div><div class="zoom"><button id="minus">−</button><span id="scale">scale 0</span><button id="plus">+</button></div></div><div class="viewport" id="viewport"></div><div class="orient"><div><span class="kicker">Path</span><strong id="pathText">The Forest</strong></div><div><span class="kicker">Nearby</span><strong id="nearbyText">0 places</strong></div><div><span class="kicker">Reality</span><strong id="realityText">authoritative</strong></div></div></section>
<aside class="rail inspector" id="inspector"><div class="railhead"><strong>Details</strong><button class="close" data-close="inspector">×</button></div><div id="details"></div></aside>
</section>
<div class="mobilebar"><button id="openLeft">☰ Outline</button><button id="back">← Back</button><button id="home">⌾ Home</button><button id="forward">Forward →</button><button id="openDetails">Details ⓘ</button></div>
</main>
<script>
const nodes=[
{id:'forest',name:'The Forest',kind:'forest',state:'authoritative',desc:'Persistent, rebuildable system for knowledge, systems, relationships, capabilities, and reusable infrastructure.'},
{id:'ai',name:'AI',kind:'tree',state:'authoritative',parent:'forest',home:'trees/ai/README.md',desc:'AI systems, capabilities, orchestration, memory, evaluation, and experimental ideas.'},
{id:'trading',name:'Trading',kind:'tree',state:'authoritative',parent:'forest',home:'trees/trading/README.md',desc:'Systematic generation, testing, screening, refinement, and maintenance of trading strategies.'},
{id:'irrigation',name:'Irrigation',kind:'tree',state:'authoritative',parent:'forest',home:'trees/irrigation/README.md',desc:'Practical irrigation knowledge across water source, pumping, distribution, controls, diagnostics, and estimating.'},
{id:'github',name:'GitHub / Infrastructure',kind:'tree',state:'authoritative',parent:'forest',home:'trees/github/README.md',desc:'Persistence, versioning, recovery, automation, deployment, and infrastructure for the Forest itself.'},
{id:'power',name:'Power / Capability',kind:'tree',state:'proposed',parent:'forest',desc:'Foundational resource and capability layer awaiting full formalization.'},
{id:'canonical-data-model',name:'Canonical Data Model',kind:'architecture',state:'authoritative',parent:'forest',home:'architecture/CANONICAL_DATA_MODEL.md'},
{id:'cognitive-visualization',name:'Cognitive Visualization',kind:'architecture',state:'authoritative',parent:'forest',home:'architecture/COGNITIVE_VISUALIZATION.md'},
{id:'world-engine',name:'World Engine',kind:'architecture',state:'authoritative',parent:'forest',home:'architecture/WORLD_ENGINE.md'},
{id:'agentic-harness',name:'Agentic Harness',kind:'architecture',state:'authoritative',parent:'forest',home:'architecture/AGENTIC_HARNESS.md'},
{id:'capability-frontier',name:'Capability Frontier',kind:'architecture',state:'authoritative',parent:'forest',home:'architecture/CAPABILITY_FRONTIER.md'},
{id:'downstairs-connector-fabric',name:'Downstairs Connector Fabric',kind:'architecture',state:'authoritative',parent:'forest',home:'architecture/DOWNSTAIRS_CONNECTOR_FABRIC.md'},
{id:'forest-chat-app',name:'Forest Chat App',kind:'capability',state:'verified',parent:'forest',home:'anatomy/FOREST_CHAT_APP_DRIVER.md'}];
const edges=[
['forest','ai','contains'],['forest','trading','contains'],['forest','irrigation','contains'],['forest','github','contains'],['forest','power','contains'],['forest','canonical-data-model','contains'],['forest','cognitive-visualization','contains'],['forest','world-engine','contains'],['forest','agentic-harness','contains'],['forest','capability-frontier','contains'],['forest','downstairs-connector-fabric','contains'],['forest','forest-chat-app','contains'],['ai','trading','AI ↔ Trading'],['ai','irrigation','AI ↔ Irrigation'],['agentic-harness','canonical-data-model','Harness ↔ Canonical Data'],['agentic-harness','cognitive-visualization','Harness ↔ Visualization'],['capability-frontier','agentic-harness','Frontier ↔ Harness'],['world-engine','canonical-data-model','World ↔ Canonical Data'],['world-engine','capability-frontier','World ↔ Frontier'],['downstairs-connector-fabric','agentic-harness','Downstairs ↔ Harness'],['downstairs-connector-fabric','world-engine','Downstairs ↔ World'],['forest-chat-app','downstairs-connector-fabric','Chat ↔ Downstairs'],['forest-chat-app','world-engine','Chat ↔ World']].map((e,i)=>({id:'e'+i,from:e[0],to:e[1],label:e[2]}));
const byId=id=>nodes.find(n=>n.id===id)||nodes[0];
const state=()=>{const p=new URLSearchParams(location.search);return{locus:byId(p.get('locus')||'forest'),view:['atlas','outline','network'].includes(p.get('view'))?p.get('view'):'atlas',scale:Math.max(0,Math.min(4,Number(p.get('scale')||0)))}};
function nav(next,push=true){const p=new URLSearchParams(location.search),s=state();if(next.locus)p.set('locus',next.locus);if(next.view)p.set('view',next.view);if(next.scale!==undefined)p.set('scale',Math.max(0,Math.min(4,next.scale)));const u=location.pathname+'?'+p.toString();push?history.pushState({},'',u):history.replaceState({},'',u);render()}
function ancestry(n){const a=[];const seen=new Set;while(n&&!seen.has(n.id)){seen.add(n.id);a.unshift(n);n=n.parent?byId(n.parent):null}return a}
function neighborhood(id){const es=edges.filter(e=>e.from===id||e.to===id),ids=new Set(es.map(e=>e.from===id?e.to:e.from));return{edges:es,nodes:nodes.filter(n=>ids.has(n.id))}}
function positions(){const map={forest:{x:50,y:50}},rest=nodes.filter(n=>n.id!=='forest');rest.forEach((n,i)=>{const r=n.kind==='tree'?28:n.kind==='architecture'?39:44,a=i/rest.length*Math.PI*2-Math.PI/2;map[n.id]={x:50+Math.cos(a)*r,y:50+Math.sin(a)*r}});return map}
const pos=positions();
function render(){const s=state(),near=neighborhood(s.locus.id),crumb=ancestry(s.locus);document.getElementById('title').textContent=s.locus.name;document.getElementById('scale').textContent='scale '+s.scale;document.getElementById('pathText').textContent=crumb.map(x=>x.name).join(' → ');document.getElementById('nearbyText').textContent=near.nodes.length+' places · '+near.edges.length+' paths';document.getElementById('realityText').textContent=s.locus.state;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===s.view));renderCrumbs(crumb);renderOutline();renderDetails(s);renderViewport(s,near)}
function renderCrumbs(list){const el=document.getElementById('crumbs');el.innerHTML='';list.forEach((n,i)=>{if(i){const x=document.createElement('span');x.className='sep';x.textContent='/';el.append(x)}const b=document.createElement('button');b.textContent=n.name;b.onclick=()=>nav({locus:n.id});el.append(b)})}
function renderOutline(){const q=document.getElementById('search').value.trim().toLowerCase(),s=state(),el=document.getElementById('outline');el.innerHTML='';nodes.filter(n=>!q||[n.name,n.desc,n.kind,n.home].filter(Boolean).some(v=>String(v).toLowerCase().includes(q))).forEach(n=>{const b=document.createElement('button');b.dataset.state=n.state;b.classList.toggle('active',n.id===s.locus.id);b.innerHTML='<span class="mark"></span><span><b>'+n.name+'</b><small>'+n.kind+'</small></span>';b.onclick=()=>{nav({locus:n.id});document.getElementById('left').classList.remove('open')};el.append(b)})}
function renderDetails(s){document.getElementById('details').innerHTML='<div class="detail"><span class="kicker">Identity</span><h3>'+s.locus.name+'</h3><code>'+s.locus.id+'</code></div><div class="facts"><div><span>Kind</span><b>'+s.locus.kind+'</b></div><div><span>Reality</span><b>'+s.locus.state+'</b></div><div><span>Scale</span><b>'+s.scale+'</b></div><div><span>View</span><b>'+s.view+'</b></div></div><div class="detail"><span class="kicker">Description</span><p>'+(s.locus.desc||'No description in this snapshot.')+'</p></div><div class="detail"><span class="kicker">Canonical home</span><code>'+(s.locus.home||'none declared')+'</code></div><div class="detail notice"><span class="kicker">Projection status</span><p>Non-authoritative portable projection of <code>gulfshobot-source/the-forest/main:data/forest.json</code>.</p></div>'}
function renderViewport(s,near){const v=document.getElementById('viewport');v.innerHTML='';if(s.view==='atlas'){const a=document.createElement('div');a.className='atlas';a.style.setProperty('--s',1+s.scale*.08);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','edges');svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');const hot=new Set(near.edges.map(e=>e.id));edges.forEach(e=>{const l=document.createElementNS('http://www.w3.org/2000/svg','line');Object.entries({x1:pos[e.from].x,y1:pos[e.from].y,x2:pos[e.to].x,y2:pos[e.to].y}).forEach(([k,val])=>l.setAttribute(k,val));if(hot.has(e.id))l.classList.add('hot');svg.append(l)});a.append(svg);nodes.forEach(n=>{const b=document.createElement('button');b.className='node'+(n.id===s.locus.id?' active':'');b.dataset.kind=n.kind;b.dataset.state=n.state;b.style.left=pos[n.id].x+'%';b.style.top=pos[n.id].y+'%';b.innerHTML='<span class="core"></span><span class="label">'+n.name+'</span>';b.onclick=()=>nav({locus:n.id});a.append(b)});v.append(a)}else if(s.view==='network'){const w=document.createElement('div');w.className='network';w.innerHTML='<div class="center" data-state="'+s.locus.state+'"><span class="mark"></span><strong>'+s.locus.name+'</strong><small>'+s.locus.kind+' · '+s.locus.state+'</small></div><div class="grid" id="ng"></div>';v.append(w);const g=w.querySelector('#ng');near.nodes.forEach(n=>{const e=near.edges.find(e=>(e.from===s.locus.id&&e.to===n.id)||(e.to===s.locus.id&&e.from===n.id)),b=document.createElement('button');b.className='card';b.dataset.state=n.state;b.innerHTML='<span class="mark"></span><b>'+n.name+'</b><small>'+(e?e.label:n.kind)+'</small>';b.onclick=()=>nav({locus:n.id});g.append(b)})}else{const w=document.createElement('div');w.className='focus';w.innerHTML='<section><span class="kicker">You are here</span><h2>'+s.locus.name+'</h2><p>'+(s.locus.desc||'No description in this snapshot.')+'</p></section><section><span class="kicker">Inside / nearby</span><div class="grid" id="og"></div></section>';v.append(w);const g=w.querySelector('#og');near.nodes.forEach(n=>{const b=document.createElement('button');b.className='card';b.innerHTML='<b>'+n.name+'</b><small>'+n.kind+' · '+n.state+'</small>';b.onclick=()=>nav({locus:n.id});g.append(b)})}}
document.getElementById('search').addEventListener('input',renderOutline);document.getElementById('views').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)nav({view:b.dataset.view},false)});document.getElementById('minus').onclick=()=>nav({scale:state().scale-1},false);document.getElementById('plus').onclick=()=>nav({scale:state().scale+1},false);document.getElementById('back').onclick=()=>history.back();document.getElementById('forward').onclick=()=>history.forward();document.getElementById('home').onclick=()=>nav({locus:'forest',scale:0});document.getElementById('openLeft').onclick=()=>document.getElementById('left').classList.add('open');document.getElementById('openDetails').onclick=()=>document.getElementById('inspector').classList.add('open');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).classList.remove('open'));window.addEventListener('popstate',render);render();
</script>
</body>
</html>
