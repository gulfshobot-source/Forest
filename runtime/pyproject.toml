[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forest-runtime"
version = "0.1.0"
description = "Deterministic continuation kernel for The Forest"
requires-python = ">=3.11"

[project.scripts]
forest = "forest_runtime.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
