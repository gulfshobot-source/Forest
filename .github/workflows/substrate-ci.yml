name: Substrate CI

on:
  push:
    paths:
      - 'experiments/substrate/app/**'
      - '.github/workflows/substrate-ci.yml'
  pull_request:
    paths:
      - 'experiments/substrate/app/**'
      - '.github/workflows/substrate-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/substrate/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
