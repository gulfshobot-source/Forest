name: Forest Runtime CI

on:
  push:
    paths:
      - "runtime/**"
      - "state/**"
      - "kernel/schemas/**"
      - ".github/workflows/runtime-ci.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "state/**"
      - "kernel/schemas/**"
      - ".github/workflows/runtime-ci.yml"

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation repository
        uses: actions/checkout@v4

      - name: Fetch structural authority registry
        run: |
          mkdir -p .canonical/the-forest/data
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/gulfshobot-source/the-forest/main/data/forest.json \
            --output .canonical/the-forest/data/forest.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime test environment
        run: python -m pip install -e "runtime[test]"

      - name: Run runtime tests against live canonical registry
        env:
          FOREST_CANONICAL_REGISTRY_PATH: ${{ github.workspace }}/.canonical/the-forest/data/forest.json
        run: python -m pytest runtime/tests -q
