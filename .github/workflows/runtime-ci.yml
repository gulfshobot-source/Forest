name: Forest Runtime CI

on:
  push:
    paths:
      - "runtime/**"
      - "state/**"
      - "kernel/schemas/**"
      - ".github/workflows/runtime-ci.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "state/**"
      - "kernel/schemas/**"
      - ".github/workflows/runtime-ci.yml"

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime test environment
        run: python -m pip install -e "runtime[test]"

      - name: Run runtime tests
        run: python -m pytest runtime/tests -q
